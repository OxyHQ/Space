# Local Postgres for the Station API test suite and for `bun run db:generate`.
#
# Plain `postgres:17-alpine` — this schema needs no PostGIS, no pgvector and no
# pg_trgm. It tracks the major of the shared RDS instance the service deploys
# against, so a version-dependent behaviour cannot differ between local and
# production.
#
# Port 5439 rather than 5432 so it collides neither with a system Postgres nor
# with a sibling Oxy service's compose file on the same machine.
#
#   docker compose -f docker-compose.postgres.yml up -d
#   TEST_DATABASE_URL=postgres://station:station@127.0.0.1:5439/postgres bun run test
#
# `name` is pinned and NOT optional. Without it docker compose derives the
# project name from the directory basename — `api` here — and every Oxy repo
# with a compose file under `apps/api` or `packages/api` then shares one compose
# project. Containers in the same project REPLACE each other: running this file
# without a pinned name deleted a sibling repo's `*-api-postgres` container
# outright (it does not stop it, it removes it), with no warning beyond one
# "Recreated" line naming the other project's container.
name: oxystation-api
services:
  postgres:
    image: postgres:17-alpine
    container_name: oxystation-api-postgres
    # Use the default bridge instead of a per-project network. Nothing here
    # talks to a sibling container by DNS name — the suite reaches it on a
    # published port — so a dedicated network buys nothing, and creating one
    # per project exhausts Docker's predefined address pools on a machine
    # running many Oxy compose files (`all predefined address pools have been
    # fully subnetted`). The alternative, pruning networks, is shared state
    # belonging to other repos.
    network_mode: bridge
    environment:
      POSTGRES_USER: station
      POSTGRES_PASSWORD: station
      # The suite creates a throwaway database per run; this is only the
      # maintenance database it connects to in order to do that.
      POSTGRES_DB: postgres
    ports:
      - '5439:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U station -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      # Throwaway by design — no volume, so a stale local database cannot
      # silently outlive the schema that created it.
      - /var/lib/postgresql/data
